<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071411">
  <title>Votar — Emite tu voto</title>
  <style>
    :root {
      --cyan: #24dfd2;
      --pink: #f32e61;
      --muted: #c4c3c7;
      --panel: rgba(18, 20, 20, .83);
      --border: rgba(205, 220, 218, .22);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #f8f8fa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 8% 5%, rgba(0, 91, 76, .26), transparent 38%),
        radial-gradient(ellipse at 93% 94%, rgba(111, 15, 42, .22), transparent 35%),
        linear-gradient(130deg, #061411 0%, #030707 48%, #090304 100%);
    }
    .panel {
      width: min(100%, 780px);
      padding: 44px 44px 46px;
      border: 1.5px solid var(--border);
      border-radius: 44px;
      background: linear-gradient(135deg, rgba(22, 31, 30, .88), var(--panel) 48%, rgba(34, 17, 22, .88));
      box-shadow: 0 24px 90px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.035);
      text-align: center;
    }
    .translate {
      width: min(100%, 560px);
      min-height: 88px;
      margin: 0 auto 34px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      padding: 18px 34px;
      border: 2px solid rgba(210,220,220,.32);
      border-radius: 999px;
      color: #f4f4f5;
      background: rgba(255,255,255,.075);
      font-size: clamp(19px, 3.4vw, 27px);
      text-align: left;
    }
    .globe { font-size: 31px; line-height: 1; }
    .brand {
      margin: 0 0 38px;
      font-size: clamp(30px, 5vw, 43px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.8px;
      background: linear-gradient(100deg, #88c9d7, #b7a0c6 55%, #f0a1b7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand span { margin-right: 12px; color: #91bdc9; -webkit-text-fill-color: #91bdc9; }
    h1 {
      margin: 0 0 30px;
      font-size: clamp(30px, 5.5vw, 46px);
      line-height: 1.12;
      letter-spacing: -.8px;
      font-weight: 800;
    }
    .intro {
      max-width: 650px;
      margin: 0 auto 54px;
      color: var(--muted);
      font-size: clamp(18px, 3.4vw, 28px);
      line-height: 1.42;
    }
    .actions { display: grid; gap: 38px; }
    .vote-button {
      min-height: 100px;
      width: 100%;
      padding: 20px 24px;
      border: 0;
      border-radius: 34px;
      color: #050707;
      background: linear-gradient(105deg, #24e0d4 0%, #80b8c3 46%, #f32d61 100%);
      font: inherit;
      font-size: clamp(19px, 3.5vw, 29px);
      font-weight: 800;
      line-height: 1.28;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.16);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }
    .vote-button:hover { transform: translateY(-3px); filter: brightness(1.07); box-shadow: 0 12px 30px rgba(0,0,0,.24); }
    .vote-button:active { transform: translateY(0); }
    .vote-button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .footer {
      margin: 34px 0 0;
      color: #aaa7aa;
      font-size: clamp(16px, 2.8vw, 23px);
      line-height: 1.45;
    }
    .footer .dot { padding: 0 5px; color: #8d898d; }
    .notice {
      display: none;
      margin: 24px 0 0;
      padding: 16px 18px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px;
      color: #e8e7e9;
      background: rgba(0,0,0,.3);
      font-size: 15px;
      line-height: 1.5;
    }
    .notice.show { display: block; }
    @media (max-width: 600px) {
      body { padding: 18px; }
      .panel { padding: 28px 20px 30px; border-radius: 30px; }
      .translate { min-height: 66px; padding: 12px 22px; margin-bottom: 30px; }
      .brand { margin-bottom: 32px; }
      h1 { margin-bottom: 24px; }
      .intro { margin-bottom: 36px; }
      .actions { gap: 22px; }
      .vote-button { min-height: 82px; border-radius: 26px; padding: 17px 14px; }
      .footer { margin-top: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="translate" aria-label="Traducir página">
      <span class="globe" aria-hidden="true">🌍</span>
      <span>Traducir página</span>
    </div>

    <div class="brand"><span aria-hidden="true">♪</span>Votar</div>
    <h1>Emitir Su Voto</h1>
    <p class="intro">Tu opinión importa. Elija una opción a continuación y ayude a dar forma al resultado.</p>

    <div class="actions">
      <button class="vote-button" id="instagramVote" type="button">Completar La Votación En Instagram</button>
      <button class="vote-button" id="emailVote" type="button">Completar La Votación Por Correo<br class="desktop-break"> Electrónico</button>
    </div>

    <p class="footer">La votación es anónima <span class="dot">·</span> Actualización de resultados en tiempo real</p>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
  </main>

  <script>
    /*
      CONFIGURACIÓN:
      1. Pega el enlace real de tu encuesta de Instagram en INSTAGRAM_VOTE_URL.
      2. Añade el correo que recibirá los votos en VOTE_EMAIL.
      Los botones mostrarán un aviso hasta que configures estos datos.
    */
    const INSTAGRAM_VOTE_URL = "";
    const VOTE_EMAIL = "";

    const notice = document.getElementById("notice");
    function showNotice(message) {
      notice.textContent = message;
      notice.classList.add("show");
    }

    document.getElementById("instagramVote").addEventListener("click", () => {
      if (INSTAGRAM_VOTE_URL.trim()) {
        window.open(INSTAGRAM_VOTE_URL, "_blank", "noopener,noreferrer");
      } else {
        showNotice("El enlace de votación de Instagram aún no está configurado. Añade tu enlace en INSTAGRAM_VOTE_URL dentro del código para activar este botón.");
      }
    });

    document.getElementById("emailVote").addEventListener("click", () => {
      if (VOTE_EMAIL.trim()) {
        const subject = encodeURIComponent("Mi voto");
        const body = encodeURIComponent("Mi voto es: ");
        window.location.href = `mailto:${VOTE_EMAIL}?subject=${subject}&body=${body}`;
      } else {
        showNotice("El correo que recibirá los votos aún no está configurado. Añade tu dirección en VOTE_EMAIL dentro del código para activar este botón.");
      }
    });
  </script>
</body>
</html>
