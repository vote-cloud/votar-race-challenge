
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOTAR RACE CHALLENGE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:#fff;font-family:Arial,sans-serif;padding:20px}
main{max-width:600px;margin:auto}
header{text-align:center;padding:30px 10px}
h1{font-size:30px;background:linear-gradient(90deg,#20e5d1,#fa5da8);background-clip:text;color:transparent}
header p{color:#aab4c8}
.panel{background:#151e30;border:1px solid #29364b;border-radius:18px;padding:22px;margin:20px 0}
h2{color:#29dfd1}
label{display:block;margin:15px 0 7px}
input,select{width:100%;padding:14px;border-radius:10px;border:1px solid #39465c;background:#0d1423;color:white;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:12px;margin-top:17px;background:linear-gradient(90deg,#19d9cf,#ed55a5);font-weight:bold;font-size:16px;color:#07111c}
button:disabled{opacity:.5}
.note{font-size:13px;color:#aab4c8;line-height:1.6}
.item{padding:12px;border-bottom:1px solid #39465c}
#message{margin-top:15px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<header>
<h1>VOTAR RACE CHALLENGE</h1>
<p>Choose your favourite contestant and cast your vote!</p>
</header>

<section class="panel">
<h2>🏆 CAST YOUR VOTE</h2>
<form id="voteForm">
<label>Your name</label>
<input id="voterName" required placeholder="Enter your name">

<label>Choose your contestant</label>
<select id="nominee" required>
<option value="">Loading contestants...</option>
</select>

<label>Voting method</label>
<select id="method" required>
<option value="">Choose method</option>
<option value="Instagram">Instagram</option>
<option value="Email">Email</option>
</select>

<label id="contactLabel">Instagram username or email</label>
<input id="contact" required placeholder="Enter your details">

<p class="note">Never enter your Instagram or email password. Votes are recorded as pending until verified.</p>
<button type="submit" id="submitVote">SUBMIT MY VOTE</button>
</form>
<div id="message"></div>
</section>

<section class="panel">
<h2>📊 LIVE VOTE TOTALS</h2>
<div id="totals">Loading totals...</div>
</section>
</main>

<script>
const db=window.supabase.createClient(
"https://jybkpokdfiwogszauvnm.supabase.co",
"sb_publishable_9S0btlgPV_AExggBMffpOA_V99RyRrP"
);

const nominee=document.getElementById("nominee");

async function loadNominees(){
 const {data,error}=await db.from("nominees").select("id,name").order("created_at");
 if(error){
  nominee.innerHTML='<option value="">Could not load contestants</option>';
  return;
 }
 nominee.innerHTML='<option value="">Choose contestant</option>';
 (data||[]).forEach(n=>{
  let o=document.createElement("option");
  o.value=n.id;
  o.textContent=n.name;
  nominee.appendChild(o);
 });
}

async function loadTotals(){
 const area=document.getElementById("totals");
 const {data,error}=await db.rpc("get_vote_totals");
 if(error){
  area.textContent="Vote totals unavailable.";
  return;
 }
 const {data:people,error:peopleError}=await db.from("nominees").select("id,name");
 if(peopleError){
  area.textContent="Could not load contestants.";
  return;
 }
 area.innerHTML="";
 (people||[]).forEach(n=>{
  let v=(data||[]).find(x=>String(x.nominee_id)===String(n.id));
  let d=document.createElement("div");
  d.className="item";
  d.textContent=n.name+" — "+(v?v.total_votes:0)+" votes";
  area.appendChild(d);
 });
}

document.getElementById("method").onchange=e=>{
 let email=e.target.value==="Email";
 document.getElementById("contactLabel").textContent=email?"Email address":"Instagram username";
 document.getElementById("contact").type=email?"email":"text";
 document.getElementById("contact").placeholder=email?"Enter your email":"Enter your Instagram username";
};

document.getElementById("voteForm").onsubmit=async e=>{
 e.preventDefault();
 let button=document.getElementById("submitVote");
 let message=document.getElementById("message");
 button.disabled=true;
 message.textContent="Submitting...";
 let method=document.getElementById("method").value;
 let {error}=await db.from("votes").insert({
  nominee_id:nominee.value,
  "Voting method":method,
  voter_contact:document.getElementById("contact").value.trim(),
  voter_name:document.getElementById("voterName").value.trim(),
  verification_status:"pending"
 });
 button.disabled=false;
 if(error){
  message.textContent="Error: "+error.message;
  return;
 }
 message.textContent="Your vote was recorded and is pending verification. Thank you!";
 e.target.reset();
 document.getElementById("contact").type="text";
 document.getElementById("contactLabel").textContent="Instagram username or email";
 await loadNominees();
 await loadTotals();
};

loadNominees();
loadTotals();
setInterval(loadTotals,30000);
</script>
</body>
</html>
